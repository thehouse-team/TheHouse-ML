# P5_8 (renta imputada si se rentara) queda EXCLUIDA (M-ML-013).
# P4_3: clase de vivienda (verificada el 2026-11-17, M-ML-014).
# INEGI reemplazó TVIVIENDA el 2024-04-03 por una corrección de P4_25_6.
variables_used = [
  "P5_1",
  "P5_2",
  "P5_5",
  "P4_3",
  "ENT",
  "TLOC",
  "FACTOR",
  "EST_DIS",
  "UPM_DIS",
