# Registro de fuentes de datos para ML-02 (T01, ampliado en T02).
# Campos obligatorios por fuente: url, edition, date, license, attribution, variables_used,
# dictionary_url y variables_status ("pending" | "confirmed").
# download_url: lista de archivos a descargar. Cada archivo es una tabla con:
#   url (obligatoria), filename, size_bytes, sha256, kind ("data" | "dictionary"),
#   table (CSV dentro del ZIP, si aplica) y encoding.
# Una fuente con download_url = [] se salta con el aviso "download_url pendiente".
# Las variables de ENVI y ENIGH se confirmaron abriendo los archivos oficiales el 2026-11-17
# (M-ML-013); las del Censo 2020 ya se confirmaron el 2026-11-10 (M-ML-010).

[[sources]]
id = "inegi_censo_2020_viviendas_ca"
name = "INEGI — Censo de Población y Vivienda 2020, muestra del cuestionario ampliado (Viviendas_CA)"
url = "https://www.inegi.org.mx/programas/ccpv/2020/#microdatos"
edition = "Censo 2020, muestra del cuestionario ampliado, tabla Viviendas_CA"
date = "2020"
license = "Términos de libre uso de la información del INEGI (citar a INEGI como autor y el producto; no sugerir respaldo de INEGI)"
attribution = "Fuente: INEGI, Censo de Población y Vivienda 2020, muestra del cuestionario ampliado."
dictionary_url = "https://www.inegi.org.mx/rnm/index.php/catalog/632/data-dictionary"
variables_status = "pending"
# TENENCIA, FACTOR y MUN ya están verificadas en M-ML-010.
# El Censo se descargará solo para Hidalgo (13) y Estado de México (15), según M-ML-013.
download_url = []  # Pendiente: falta la URL directa y su hash verificado.
variables_used = [
  "TENENCIA",
  "FACTOR",
  "MUN",
  "ENT",
  "AGUA_ENT",
  "DRENAJE",
