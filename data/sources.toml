# Registro de fuentes de datos para ML-02 (T01, ampliado en T02).
# Campos obligatorios por fuente: url, edition, date, license, attribution, variables_used,
# dictionary_url y variables_status ("pending" | "confirmed").
# download_url: lista de archivos a descargar. Cada archivo es una tabla con:
#   url (obligatoria), filename, size_bytes, sha256, kind ("data" | "dictionary"),
#   table (CSV dentro del ZIP, si aplica) y encoding.
# Una fuente con download_url = [] se salta con el aviso "download_url pendiente".
# Las variables de ENVI y ENIGH se confirmaron abriendo los archivos oficiales el 2026-11-17
# (M-ML-013); las del Censo 2020 se confirmaron con su diccionario el 2026-11-17 (M-ML-015).

[[sources]]
id = "inegi_censo_2020_viviendas_ca"
name = "INEGI — Censo de Población y Vivienda 2020, muestra del cuestionario ampliado (Viviendas_CA)"
url = "https://www.inegi.org.mx/programas/ccpv/2020/#microdatos"
edition = "Censo 2020, muestra del cuestionario ampliado, tabla Viviendas_CA"
date = "2020"
license = "Términos de libre uso de la información del INEGI (citar a INEGI como autor y el producto; no sugerir respaldo de INEGI)"
attribution = "Fuente: INEGI, Censo de Población y Vivienda 2020, muestra del cuestionario ampliado."
dictionary_url = "https://www.inegi.org.mx/contenidos/programas/ccpv/2020/microdatos/diccionario_cuestionario_ampliado_cpv2020.xlsx"
variables_status = "confirmed"  # Verificado por el responsable abriendo los archivos el 2026-11-17 (M-ML-015).
# Solo Hidalgo (13) y Estado de México (15), tabla Viviendas (M-ML-013 y M-ML-015).
download_url = [
  { url = "https://www.inegi.org.mx/contenidos/programas/ccpv/2020/microdatos/Censo2020_CA_hgo_csv.zip", filename = "Censo2020_CA_hgo_csv.zip", size_bytes = 17225011, sha256 = "5d0ff2b338acb93f8558ef2fed0500c1b4af004cdfc5ee34fb1fec7faa21e865", kind = "data", table = "Viviendas13.CSV", encoding = "latin-1" },
  { url = "https://www.inegi.org.mx/contenidos/programas/ccpv/2020/microdatos/Censo2020_CA_mex_csv.zip", filename = "Censo2020_CA_mex_csv.zip", size_bytes = 41189169, sha256 = "178a2a5c3a0b7b08a1ac878a5e94ca4e6c9b9d5851d98b8b07fe2f9d35672c2b", kind = "data", table = "Viviendas15.CSV", encoding = "latin-1" },
  { url = "https://www.inegi.org.mx/contenidos/programas/ccpv/2020/microdatos/diccionario_cuestionario_ampliado_cpv2020.xlsx", filename = "diccionario_cuestionario_ampliado_cpv2020.xlsx", size_bytes = 95642, sha256 = "e728cdac1872be856ba15c2902a77fb6c03e60c2d98619b7ae8988cc82afb6dc", kind = "dictionary" },
  { url = "https://www.inegi.org.mx/contenidos/programas/ccpv/2020/microdatos/Censo2020_clasificaciones_CPV.xlsx", filename = "Censo2020_clasificaciones_CPV.xlsx", size_bytes = 210951, sha256 = "64c7d6974392132258d77b8697e92cb9f39ba4cd303fc5a9c0f32861f174f381", kind = "dictionary" },
]
# Códigos confirmados en el diccionario oficial (M-ML-015):
# TENENCIA 2 = se paga renta (1 propia, 3 prestada, 4 otra); INTERNET 7 sí / 8 no;
# ELECTRICIDAD 1 sí / 3 no; AGUA_ENTUBADA 1 dentro, 2 patio, 3 no tiene;
# DRENAJE 1-4 tiene / 5 no tiene; COMBUSTIBLE 1 leña o carbón, 2 gas, 3 electricidad,
# 4 otro, 5 no cocinan; 9 y blanco = no especificado (se excluyen del denominador).
variables_used = [
  "ENT",
  "MUN",
  "FACTOR",
  "ESTRATO",
  "UPM",
  "TENENCIA",
  "AGUA_ENTUBADA",
  "DRENAJE",
  "ELECTRICIDAD",
  "INTERNET",
  "COMBUSTIBLE",
]

