name = "INEGI — Encuesta Nacional de Vivienda (ENVI) 2020"
url = "https://www.inegi.org.mx/programas/envi/2020/"
edition = "ENVI 2020 (INEGI, Infonavit, SHF)"
date = "2020"
license = "Términos de libre uso de la información del INEGI (citar a INEGI como autor y el producto; no sugerir respaldo de INEGI)"
attribution = "Fuente: INEGI, Encuesta Nacional de Vivienda (ENVI) 2020."
dictionary_url = "https://www.inegi.org.mx/rnm/index.php/catalog/695/data-dictionary"
variables_status = "confirmed"  # Verificado abriendo los archivos oficiales el 2026-11-17 (M-ML-013).
download_url = [
  { url = "https://www.inegi.org.mx/contenidos/programas/envi/2020/microdatos/envi_2020_base_de_datos_csv.zip", filename = "envi_2020_base_de_datos_csv.zip", size_bytes = 7322530, sha256 = "36b8e3d04f37722974e0d48edb2b4708b4a5e55c9c3faa551b9b75fda95cc40b", kind = "data", table = "Bases de datos/TVIVIENDA.csv", encoding = "latin-1" },
  { url = "https://www.inegi.org.mx/contenidos/programas/envi/2020/microdatos/envi_2020_fd.xlsx", filename = "envi_2020_fd.xlsx", size_bytes = 242100, sha256 = "208fc3d2c70a4cc2b346479813fd98c0481fa5c490d5c8bc2ca8970694befbcf", kind = "dictionary" },
]
# Tabla: "Bases de datos/TVIVIENDA.csv" (codificación latin-1); el XLSX es el diccionario oficial.
# P5_1: tenencia (1 = rentada); P5_2: cuánto se paga al mes; P5_5: motivo de renta.
# P5_8 (renta imputada si se rentara) queda EXCLUIDA (M-ML-013).
# INEGI reemplazó TVIVIENDA el 2024-04-03 por una corrección de P4_25_6.
variables_used = [
  "P5_1",
  "P5_2",
  "P5_5",
  "ENT",
  "TLOC",
  "FACTOR",
  "EST_DIS",
  "UPM_DIS",
]

