[project]
name = "thehouse-ml"
version = "0.1.0"
description = "Modelo de compatibilidad de Smart Match de TheHouse: produce un artefacto ONNX que carga TheHouse-Backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheHouse team" }]
# ML-01 no necesita dependencias de ejecución: cada spec agrega las suyas
# desde la tabla de la constitution §5.
dependencies = []

[project.scripts]
thehouse-ml = "thehouse_ml.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.7"
# Reproducibilidad y cadena de suministro: no se resuelven versiones
# publicadas después de esta fecha (constitution §9 y §14).
exclude-newer = "2026-10-27T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # orden de imports
    "B",        # bugbear
    "UP",       # sintaxis moderna
    "N",        # nombres
    "S",        # seguridad (bandit)
    "SIM",      # simplificaciones
    "RUF",      # reglas de ruff
]

[tool.ruff.lint.per-file-ignores]
# En pruebas se permite assert y subprocess con entradas controladas.
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: prueba de una etapa o del paquete completo",
]

[tool.coverage.run]
source = ["thehouse_ml"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
