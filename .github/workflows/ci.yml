# ML-01 — Integración continua (constitution §17).
# Corre en cada pull request y push a main. No usa secretos ni publica nada.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Entorno reproducible (uv.lock)
        run: uv sync --frozen

      - name: Formato (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tipos (mypy estricto)
        run: uv run mypy src

      - name: Pruebas y cobertura (mínimo 80 %)
        run: uv run pytest --cov=thehouse_ml --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: CLI con las cinco etapas
        run: |
          uv run python -m thehouse_ml --help
          for stage in download prepare train evaluate export; do
            uv run python -m thehouse_ml "$stage"
          done

      - name: Artefacto de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: warn

  tests-windows:
    name: tests-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Entorno reproducible (uv.lock)
        run: uv sync --frozen

      - name: Pruebas en Windows (riesgo ML-01-RK01)
        run: uv run pytest

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Entorno reproducible (uv.lock)
        run: uv sync --frozen

      - name: Vulnerabilidades conocidas (pip-audit)
        run: uv run pip-audit --skip-editable

  secrets-gitleaks:
    name: secrets-gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks sobre todo el historial
        run: >
          docker run --rm -v "$PWD:/repo" --user "$(id -u):$(id -g)"
          "$GITLEAKS_IMAGE" git /repo
          --redact --no-banner --exit-code 1
          --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Artefacto Gitleaks (valores redactados)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14
          if-no-files-found: warn
